[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molavi-web-intelligence"
version = "0.1.0"
description = "Open-source, self-hosted web intelligence engine for SEO, GEO, AI Search and autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Taqi Molavi", email = "contact@molavi.pro" }
]
keywords = [
    "seo",
    "geo",
    "generative-engine-optimization",
    "ai-search",
    "web-scraping",
    "web-crawling",
    "web-intelligence",
    "ai-agents",
    "mcp",
    "playwright"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "playwright>=1.40.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
mwie-api = "mwie.api.app:app"
mwie-mcp = "mwie.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mwie"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
